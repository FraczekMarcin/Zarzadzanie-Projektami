# ==============================================================================
# Uruchomienie: dodaj do .env: COMPOSE_FILE=docker-compose.yml:docker-compose.https.yml
# i uruchom: docker compose up -d --build (lub docker compose -f docker-compose.yml -f docker-compose.https.yml up -d)

services:
  app:
    ports: !reset []
    environment:
      TRUST_PROXY: "1"

  caddy:
    image: caddy:2-alpine
    container_name: zarzadzanie_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    environment:
      APP_HOST: ${APP_HOST:?ustaw APP_HOST (np. nazwa hosta lub IP serwera) w pliku .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - zarzadzanie_net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:2019/config/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    depends_on:
      app:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:

networks:
  zarzadzanie_net:
