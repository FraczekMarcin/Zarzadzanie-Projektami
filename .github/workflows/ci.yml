name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  test-and-build:
    name: Lint, Test, Audit and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Wersje Node.js i npm
        run: |
          node -v
          npm -v

      - name: Instalacja zależności (npm ci)
        run: npm ci

      - name: Weryfikacja podpisów pakietów npm (npm audit signatures)
        run: npm audit signatures

      - name: Weryfikacja typów TypeScript (lint)
        run: npm run lint

      - name: Testy jednostkowe i integracyjne (vitest)
        run: npm test

      - name: Budowanie aplikacji produkcyjnej (build)
        run: npm run build

      - name: Audyt bezpieczeństwa zależności produkcyjnych
        run: npm audit --omit=dev --audit-level=high

      - name: Budowanie obrazu Docker (weryfikacja Dockerfile)
        run: docker build -t zp .

      - name: Uruchomienie obrazu Docker (test dymny)
        run: |
          docker run -d --name zp \
            -e APP_SECRET=$(openssl rand -hex 32) \
            -e NODE_ENV=production \
            -p 3000:3000 \
            zp

      - name: Weryfikacja uruchomienia i test dymny kontenera (GET /api/health, GET /server.js oraz Docker HEALTHCHECK)
        run: |
          echo "Oczekiwanie na uruchomienie aplikacji (do 30 s)..."
          SUCCESS=0
          for i in {1..30}; do
            STATUS=$(curl -s -o /tmp/health.json -w "%{http_code}" http://127.0.0.1:3000/api/health || true)
            if [ "$STATUS" = "200" ]; then
              SUCCESS=1
              break
            fi
            sleep 1
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "Błąd: Serwer nie odpowiedział statusem 200 na /api/health w ciągu 30 s (ostatni status: $STATUS)."
            exit 1
          fi

          if ! grep -q '"status":"ok"' /tmp/health.json; then
            echo "Błąd: Odpowiedź /api/health nie zawiera '\"status\":\"ok\"':"
            cat /tmp/health.json
            exit 1
          fi
          echo "Endpoint /api/health zwrócił status 200 oraz '\"status\":\"ok\"'."

          CTYPE=$(curl -s -I http://127.0.0.1:3000/server.js | tr -d '\r' | awk -F': ' 'tolower($1)=="content-type" {print $2}')
          if [[ "$CTYPE" != *"text/html"* ]]; then
            echo "Błąd: GET /server.js zwrócił Content-Type: '$CTYPE', oczekiwano 'text/html'."
            exit 1
          fi
          echo "Endpoint /server.js poprawnie zwrócił fallback HTML (Content-Type: $CTYPE) bez wycieku kodu źródłowego."

          echo "Oczekiwanie na status healthy kontenera Docker (do 90 s)..."
          HEALTH_STATUS=""
          for i in {1..45}; do
            HEALTH_STATUS=$(docker inspect -f '{{.State.Health.Status}}' zp 2>/dev/null || echo "unknown")
            if [ "$HEALTH_STATUS" = "healthy" ]; then
              break
            fi
            sleep 2
          done

          if [ "$HEALTH_STATUS" != "healthy" ]; then
            echo "Błąd: Kontener zp nie osiągnął statusu 'healthy' w ciągu 90 s (aktualny status: $HEALTH_STATUS)."
            echo "--- docker logs zp ---"
            docker logs zp || true
            echo "--- .State.Health.Log ---"
            docker inspect -f '{{range .State.Health.Log}}Start={{.Start}} End={{.End}} ExitCode={{.ExitCode}} Output={{.Output}}{{printf "\n"}}{{end}}' zp || true
            exit 1
          fi
          echo "Kontener zp osiągnął status 'healthy'."

      - name: Logi i zatrzymanie kontenera testowego
        if: always()
        run: |
          docker logs zp || true
          docker stop zp || true

  e2e:
    name: End-to-End (Playwright)
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Pobierz kod źródłowy (Checkout)
        uses: actions/checkout@v4

      - name: Konfiguracja Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'

      - name: Wersje Node.js i npm
        run: |
          node -v
          npm -v

      - name: Instalacja zależności (npm ci)
        run: npm ci

      - name: Budowanie aplikacji produkcyjnej (build)
        run: npm run build

      - name: Instalacja przeglądarki Chromium dla Playwright
        run: npm run e2e:install

      # Po przeglądzie raportu dostępności zmienić A11Y_STRICT na 'true'
      - name: Uruchomienie testów end-to-end (Playwright)
        env:
          A11Y_STRICT: 'false'
        run: npm run test:e2e

      - name: Prześlij raport dostępności (Axe WCAG)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: test-results/a11y-report.json
          retention-days: 14

      - name: Prześlij raport HTML i ślady Playwright w razie błędu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

